[project]
name = "aml-investigation-agent"
version = "0.1.0"
description = "Autonomous AML Investigation Agent"
authors = [
    {name = "Rohit Shukla", email = "rshukla560@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13, <4.0"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "httpx",
    "requests",
    "anthropic",
    "langchain==0.3.7",
    "langchain-anthropic==0.3.7",
    "langchain-community==0.3.7",
    "langgraph==0.2.60",
    "qdrant-client",
    "xgboost",
    "scikit-learn",
    "pandas",
    "numpy",
    "joblib",
    "sqlalchemy",
    "asyncpg",
    "streamlit",
    "kafka-python",
    "pyarrow",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ragas>=0.2.0",
    "evidently",
    "httpx",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false