[project]
name = "aml-investigation-agent"
version = "0.1.0"
description = "Autonomous AML Investigation Agent"
authors = [ {name = "Rohit Shukla", email = "rshukla560@gmail.com"}]

license = "MIT"
readme = "README.md"
requires-python = ">=3.13, <4.0"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "httpx",
    "requests",
    "anthropic",
    "langchain==0.3.7",
    "langchain-anthropic==0.3.7",
    "langchain-community==0.3.7",
    "langgraph==0.2.60",
    "qdrant-client",
    "xgboost",
    "scikit-learn",
    "pandas",
    "numpy",
    "joblib",
    "sqlalchemy",
    "asyncpg",
    "streamlit",
    "kafka-python",
    "pyarrow",
    "sentence-transformers",
    "torch"]                # named explicitly so we can choose its source this section is main

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-asyncio = "*"
ragas = ">=0.2.0"
evidently = "*"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

# PyTorch's CPU-only wheels (no nvidia-* / cuda-* packages)
[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"              # used only by packages that name it

[tool.poetry.dependencies]
torch = { source = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = ["."]