services:

  fastapi:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - POSTGRES_URL=postgresql://aml_user:aml_password@postgres:5432/aml_investigations
      - KAFKA_BROKER=kafka:9092
      - CONFIDENCE_THRESHOLD=0.75
      - DISAGREEMENT_THRESHOLD=0.3
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
    depends_on:
      - qdrant
      - postgres
      - kafka

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=aml_user
      - POSTGRES_PASSWORD=aml_password
      - POSTGRES_DB=aml_investigations
    volumes:
      - postgres_data:/var/lib/postgresql/data

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./backend:/app/backend
    depends_on:
      - fastapi

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    ports:
      - "9092:9092"
    environment:
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    depends_on:
      - zookeeper

volumes:
  qdrant_data:
  postgres_data: